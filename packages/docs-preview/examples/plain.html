<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>map-tools · 示例 · 原生 HTML</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        background: #0a1210;
        color: #cdeee0;
        font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      #toolbar {
        flex: 0 0 auto;
      }
      #app {
        flex: 1;
        position: relative;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="toolbar"></div>
    <div id="app"></div>
    <!-- UMD 产物：由 scripts/copy-umd.mjs 复制到 examples/public/vendor/，
         构建后随 publicDir 进入 public/demos/vendor/，全局名 FE_utils -->
    <script src="./vendor/fe-utils.umd.js"></script>
    <script type="module" src="/src/entries/plain.ts"></script>
  </body>
</html>
